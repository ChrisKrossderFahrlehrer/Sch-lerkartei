<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressum – FahrSync</title>
<link rel="canonical" href="https://fahrsync.de/impressum.html">
<meta name="description" content="Impressum von FahrSync – Angaben gemäß § 5 DDG.">
<style>
  :root { --bg:#0d1117; --surface:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#ffd454; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; line-height:1.6; }
  .wrap { max-width:640px; margin:0 auto; padding:32px 20px 60px; }
  h1 { font-size:1.5rem; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:0.85rem; margin-bottom:28px; }
  .block { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:16px; }
  .block h2 { font-size:0.95rem; margin:0 0 10px; }
  .block p { margin:0; font-size:0.92rem; }
  a { color:var(--accent); text-decoration:none; }
  .back { display:inline-block; margin-bottom:20px; color:var(--muted); font-size:0.85rem; }
  #imp-loading { color:var(--muted); font-size:0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← Zur Startseite</a>
  <h1>Impressum</h1>
  <div class="sub">Angaben gemäß § 5 DDG</div>
  <!-- Steht sofort da und bleibt stehen, falls das Skript gar nicht laedt;
       wird sonst durch die vollstaendigen Angaben aus der Datenbank ersetzt. -->
  <div id="imp-content">
    <div class="block">
      <h2>👤 Verantwortlich</h2>
      <p><strong>Christopher Korting</strong></p>
    </div>
    <div class="block">
      <h2>📱 Kontakt</h2>
      <p>✉️ <a href="mailto:kontakt@fahrsync.de">kontakt@fahrsync.de</a></p>
    </div>
    <div id="imp-loading">Vollständige Angaben werden geladen…</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD490kLzTOq3h3VdQ9ZqWZd_aXcDRfxBOs",
  authDomain: "fahrschule-ebc65.firebaseapp.com",
  projectId: "fahrschule-ebc65",
  storageBucket: "fahrschule-ebc65.firebasestorage.app",
  messagingSenderId: "194338111405",
  appId: "1:194338111405:web:73e2f31d69cde3ac9beb24"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Die Werte kommen aus der Datenbank und landen per innerHTML im Text UND in
// Attributen (mailto:, https://) - deshalb an der Quelle entwerten.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

// Das Impressum muss ständig erreichbar sein. Laedt die Datenbank nicht
// (offline, Werbeblocker, Stoerung), stand hier frueher nur "konnte nicht
// geladen werden" - jetzt erscheinen wenigstens Betreiber und Kontakt.
let d = {}, geladen = false;
try {
  const snap = await getDoc(doc(db, 'platform', 'impressum'));
  d = snap.exists() ? snap.data() : {};
  geladen = true;
} catch(e) {
  console.error('Impressum laden:', e);
}

const name    = esc(d.name    || 'Christopher Korting');
const inhaber = esc(d.inhaber || '');
const strasse = esc(d.strasse || '');
const plz     = esc(d.plz     || '');
const ort     = esc(d.ort     || '');
const tel     = esc(d.tel     || '');
const email   = esc(d.email   || 'kontakt@fahrsync.de');
const web     = esc(d.web     || 'fahrsync.de');
// Die Steuernummer gehoert auf Rechnungen, nicht ins Impressum (§ 5 DDG
// verlangt sie nicht; oeffentlich zeigen wird wegen Missbrauchsgefahr
// abgeraten). Sie bleibt in der Datenbank und auf den Rechnungen erhalten.
const wIdNr   = esc(d.wirtschaftsId || 'DE464533862-00001');

document.getElementById('imp-content').innerHTML = `
  ${geladen ? '' : '<div class="block"><p style="color:var(--muted)">Die Anschrift konnte gerade nicht geladen werden – bitte Seite neu laden.</p></div>'}
  <div class="block">
    <h2>👤 Verantwortlich</h2>
    <p>
      <strong>${name}</strong><br>
      ${inhaber ? inhaber + '<br>' : ''}
      ${strasse ? strasse + '<br>' : ''}
      ${(plz + ' ' + ort).trim()}
    </p>
  </div>
  <div class="block">
    <h2>📱 Kontakt</h2>
    <p>
      ${tel   ? '📞 ' + tel + '<br>' : ''}
      ${email ? '✉️ <a href="mailto:'+email+'">'+email+'</a><br>' : ''}
      ${web   ? '🌐 <a href="https://'+web+'">'+web+'</a>' : ''}
    </p>
  </div>
  <div class="block">
    <h2>🧾 Steuerliche Angaben</h2>
    <p>Wirtschafts-Identifikationsnummer gem. § 5 DDG: ${wIdNr}</p>
  </div>
  <div class="block">
    <h2>🔒 Datenschutz</h2>
    <p>Informationen zur Verarbeitung personenbezogener Daten findest du in unserer <a href="./datenschutz.html">Datenschutzerklärung</a>.</p>
  </div>
  <div class="block">
    <h2>⚖️ Haftungshinweis</h2>
    <p style="color:var(--muted);font-size:0.85rem">Trotz sorgfältiger inhaltlicher Kontrolle übernehmen wir keine Haftung für die Inhalte externer Links. Für den Inhalt der verlinkten Seiten sind ausschließlich deren Betreiber verantwortlich.</p>
  </div>
`;
</script>
</body>
</html>
