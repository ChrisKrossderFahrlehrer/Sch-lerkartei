<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ADK LOAD TEST</title>
<style>
body { 
  font-family: monospace; 
  padding: 20px; 
  background: #0d1117; 
  color: #3fb950; 
}
#status { font-size: 18px; margin: 20px 0; }
.error { color: #f85149; }
</style>
</head>
<body>
<h1>🔍 ADK Load Test</h1>
<div id="status">Lade...</div>

<script type="module">
console.log('[TEST] Script startet...');

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
console.log('[TEST] ✓ Firebase App importiert');

import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
console.log('[TEST] ✓ Firebase Auth importiert');

import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
console.log('[TEST] ✓ Firebase Firestore importiert');

const firebaseConfig = {
  apiKey: "AIzaSyByy2FXkwxP4JjYX7gTKNIXLbRU0CPEf2o",
  authDomain: "fahrschule-ebc65.firebaseapp.com",
  projectId: "fahrschule-ebc65",
  storageBucket: "fahrschule-ebc65.firebasestorage.app",
  messagingSenderId: "488993632606",
  appId: "1:488993632606:web:45c68ca6f5d52aee0a6677"
};

const app = initializeApp(firebaseConfig);
console.log('[TEST] ✓ Firebase initialisiert');

const auth = getAuth(app);
const db = getFirestore(app);
console.log('[TEST] ✓ Auth & Firestore initialisiert');

// Konstanten definieren
const SONDERFAHRTEN = [
  { key:'ueber', icon:'🌄', name:'Überland', min:5 },
];
console.log('[TEST] ✓ Konstanten definiert');

// Test-Funktion
async function testMigration() {
  console.log('[TEST] Migration-Funktion wird definiert...');
  
  try {
    const codes = await getDocs(collection(db, 'accessCodes'));
    console.log('[TEST] ✓ Firestore erreichbar:', codes.size, 'Codes');
    
    document.getElementById('status').innerHTML = `
      ✅ ALLES LÄDT KORREKT!<br><br>
      Firebase: OK<br>
      Firestore: OK (${codes.size} Codes)<br>
      Konstanten: OK<br><br>
      <span style="color:#888">→ index.html sollte auch laden!</span>
    `;
    
  } catch(e) {
    console.error('[TEST] ✗ Firestore Fehler:', e);
    document.getElementById('status').innerHTML = `
      <span class="error">❌ FEHLER!</span><br><br>
      ${e.message}<br><br>
      Code: ${e.code}
    `;
  }
}

// Auth State prüfen
onAuthStateChanged(auth, (user) => {
  console.log('[TEST] Auth State:', user ? 'Eingeloggt' : 'Nicht eingeloggt');
  testMigration();
});

console.log('[TEST] ✓ Script komplett geladen!');
document.getElementById('status').textContent = '⏳ Teste Firestore...';
</script>
</body>
</html>
